<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar using flexbox</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300&display=swap');


        ul {
            display: flex;
            gap: 34px;



        }

        ul li {
            list-style: none;
            display: flex;
            align-items: center;

        }

        ul li a {
            text-decoration: none;
            color: black;
            font-family: 'Poppins', sans-serif;
            display: inline;


        }

        ul li:hover {
            cursor: pointer;

        }

        .logo img {
            width: 170px;
        }

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .container{
            /*border: 2px solid black;*/
            margin-top: 50px;
            margin: auto;
        }

        .items{
            display: grid;
            width: 700px;
            margin: auto;
           /*border: 2px solid black;*/
            grid-template-columns: 1fr 1fr 1fr;
            column-gap: 3px;
            row-gap: 30px;
            justify-content: center;
        }
        .item {

          /*  border: 2px solid black;*/
            width: 230px;
            height: 200px;
            text-align: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;

        }
        .item button{
            padding: 6px;
            font-size: 10px;
            width: 40%;
            margin: 3px;
            border: none;
            border-radius: 5px;
        }
        .btn-32{
            color: white;
            background-color: rgb(54, 136, 224);
        }
        .btn-64{
            color: white;
            background-color: rgb(36, 158, 58);
        }
        @media screen and (max-width:673px){
            .items{
                display: grid;
          /*  border: 2px solid black;*/
            grid-template-columns: 1fr 1fr;
            column-gap: 3px;
            row-gap: 30px;
            justify-content: center;
            }
            
            
        }
        @media screen and (max-width:500px){
            .container{
               
            margin-top: 50px;
            margin-top: 50px;
            margin: auto;

            }
            .items{
                display: grid;
          /*  border: 2px solid black;*/
            grid-template-columns: 1fr;
            column-gap: 3px;
            row-gap: 30px;
            justify-items: center;
            margin-top: 50px;
            margin: auto;
            }
            
            
        }
        
    </style>
</head>
