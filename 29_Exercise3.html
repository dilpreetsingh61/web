<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@400..800&display=swap');
        
            @import url('https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@400..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        .container{
            border: 2px solid black;
            border-radius: 20px;
            width: 25vw;
            padding: 3px;
            margin: auto;
            min-height: 70vh;
            box-shadow: 0 0 8px 8px #08070785;
            font-family: "Baloo Thambi 2", system-ui;
        }
        img{
            width:100%;
            border-radius: 20px;
            margin-bottom: 5px;

        }
        .capsules{
            border: 2px ;
        }
        span{
            border-radius: 30px;
            border: 0.2px solid rgb(190, 194, 236);
            display: inline-block;
            padding: 0px 8px;
            text-transform: capitalize;
            margin-left: 10px;
            cursor: pointer;
        }
        .main-content{
            padding: 5px;
            font-family: "Poppins", sans-serif;
            font-style: normal;
        }
        button{
            padding: 9px;
            border-radius: 20px;
            display: block;
            width: 100px;
            margin: auto;
            color: blue;
            font-weight: bolder;
            border: none;
            background-color: rgb(212, 212, 228);
            cursor: pointer;
            
            

            
        }
    </style>
</head>
<body>
    <!-- card.png is a file which contains a card Image. Write html and css code to design this card. Use #html -->
     <div class="container">

        <div class="capsules"><span>nature</span><span>lake</span></div>
        <div class="main-content">

            <button>Read more</button>
        </div>
     </div>
